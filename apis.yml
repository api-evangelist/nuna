aid: nuna
name: Nuna
description: >-
  Nuna Incorporated is a San Francisco healthcare data and technology company founded in 2010 by Jini
  Kim and David Chen. Nuna built the first national Medicaid claims dataset and data pipeline for the
  Centers for Medicare & Medicaid Services, and has since moved its consumer-facing product to an
  AI-powered chronic-care coaching app delivered through health plans, employers and provider systems
  such as Hill Physicians, Rush, Cleveland Clinic, Northwestern and Sanitas. Nuna sells to health
  plans, employers, government agencies and provider organizations rather than to developers: as of
  this profile the company publishes no public developer portal, API reference, or machine-readable
  API contract of any kind. Its public engineering output is a small set of open-source internal
  tooling repositories under the NunaInc GitHub organization, and its public security posture is
  documented through a Vanta-hosted trust center covering SOC 2 Type II and HIPAA/HITECH.
